[project]
name = "sliding"
version = "1.0"
authors = [{ name = "Ambyli" }]
description = """\
*Adds sliding to BL2/TPS/AoDK.*  
Pressing crouch while sprinting will make you slide.
If you jump while sliding, you will jump keep the momentum, which generally makes you go further.  
Sliding down slopes will accelerate you, while sliding up slopes will slow you down.
"""
dependencies = [
    "uemath >= 1.0",
    "coroutines >= 1.0",
    "tweens >= 1.0",
]


[tool.sdkmod]
name = "Sliding"
coop_support = "RequiresAllPlayers"
license = {name = "MIT", url = "https://choosealicense.com/licenses/mit/" }
download = "https://github.com/Ambyli/BL2_Movement/raw/refs/heads/main/Sliding.sdkmod"


# --- dev tooling -----------------------------------------------------------------------------------
# The runtime deps above (uemath, coroutines, tweens) are provided by the game's embedded Python via
# pyunrealsdk and are not on PyPI. Do NOT `uv sync` — it will try to resolve them and fail. Set the
# venv up with `uv venv` and install dev tools via `uv pip install --group dev`.

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.4",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["__init__.py.orig"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "PL", "S", "BLE", "UP", "SIM", "RUF"]
ignore = [
    "PLR2004",  # magic numbers are the whole point of a tuning file
    "S101",     # asserts are fine in tests
]

[tool.ruff.lint.per-file-ignores]
"__init__.py.orig" = ["ALL"]
# Test helpers legitimately need more args than five (mirroring game APIs, driving multi-frame sims).
"tests/*" = ["PLR2004", "S101", "PLR0913", "PLR0917"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]